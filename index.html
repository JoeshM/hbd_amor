<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour Francisca ❤️</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Dancing+Script:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      min-height: 100svh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Poppins', sans-serif;
      background: #07030d;
      color: #3e1f2b;
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 16px 24px;
    }

    #bgCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    

    .floating-heart {
      position: fixed;
      font-size: 24px;
      color: rgba(255,255,255,0.32);
      user-select: none;
      pointer-events: none;
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% { transform: translateY(110vh) scale(0.8) rotate(0deg); opacity: 0; }
      10% { opacity: 0.9; }
      90% { opacity: 0.9; }
      100% { transform: translateY(-10vh) scale(1.2) rotate(720deg); opacity: 0; }
    }

    .intro-screen {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, rgba(255,65,120,0.16), transparent 35%), linear-gradient(135deg, #04010e 0%, #14031d 50%, #05020c 100%);
      transition: opacity 1.1s ease, transform 1.1s ease;
    }

    .intro-screen.closing {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    .intro-content {
      text-align: center;
      max-width: 760px;
      padding: 34px;
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(15px);
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      transform: translateY(20px);
      animation: introRise 1.3s ease forwards;
    }

    @keyframes introRise {
      from { opacity: 0; transform: translateY(28px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro-line {
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      color: #ffe7f1;
      line-height: 1.7;
      margin-bottom: 10px;
      text-shadow: 0 0 16px rgba(255,255,255,0.2);
      opacity: 0;
      animation: textFade 1.2s ease forwards;
    }

    .intro-line:nth-child(2) { animation-delay: 1.2s; }
    .intro-line.secondary { font-size: clamp(1.4rem, 2.4vw, 2.2rem); font-weight: 700; color: #ffd5e5; margin-top: 12px; }

    @keyframes textFade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .intro-btn {
      margin-top: 24px;
      border: none;
      padding: 16px 24px;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 700;
      color: white;
      background: linear-gradient(90deg, #ff5d90, #ff8f4a, #ff5d90);
      background-size: 200% 100%;
      box-shadow: 0 10px 30px rgba(250,90,136,0.35);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      animation: hue 2.4s linear infinite;
    }

    .intro-btn:hover { transform: scale(1.05); box-shadow: 0 16px 40px rgba(250,90,136,0.42); }
    @keyframes hue { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

    .app-shell {
      position: relative;
      z-index: 5;
      width: min(1120px, 100%);
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .app-shell.ready {
      opacity: 1;
      transform: scale(1);
    }

    .card {
      position: relative;
      background: linear-gradient(135deg, rgba(255,255,255,0.24), rgba(255,255,255,0.12));
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 32px;
      box-shadow: 0 20px 48px rgba(0,0,0,0.2);
      padding: 22px 24px 20px;
      display: flex;
      flex-direction: column;
      min-height: auto;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(255,255,255,0.22), transparent 35%, rgba(255,255,255,0.15));
      pointer-events: none;
      mix-blend-mode: screen;
    }

    h1 {
      text-align: center;
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.2rem, 3vw, 3.2rem);
      color: #a11b3e;
      margin-bottom: 10px;
      letter-spacing: 1.5px;
      text-shadow: 0 0 18px rgba(255,255,255,0.3);
      word-break: break-word;
      animation: glowText 3s ease-in-out infinite;
    }

    @keyframes glowText {
      0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.18), 0 0 24px rgba(255,87,139,0.18); }
      50% { text-shadow: 0 0 18px rgba(255,255,255,0.28), 0 0 36px rgba(255,87,139,0.28); }
    }

    h1 span { display: inline-block; animation: heartbeat 1.6s infinite; }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.15); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } 60% { transform: scale(1); } }

    .photo-showcase {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 8px 0 10px;
      animation: fadeUp 0.8s ease both;
    }

    .photo-orbit {
      position: relative;
      width: 180px;
      height: 180px;
      display: grid;
      place-items: center;
    }

    .photo-frame {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,122,154,0.8));
      box-shadow: 0 10px 24px rgba(181,29,72,0.18);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      border: 2px solid rgba(255,255,255,0.75);
    }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .content {
      display: flex;
      flex: 1;
      gap: 16px;
      min-height: 0;
      align-items: flex-start;
      animation: fadeUp 1s ease both;
      animation-delay: .3s;
    }

    .letter-column {
      flex: 1.25;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .envelope-shell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 320px;
      perspective: 1200px;
      position: relative;
      width: 100%;
    }

    .envelope {
      position: relative;
      width: min(100%, 420px);
      height: 260px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s ease, opacity 0.7s ease;
      z-index: 2;
    }

    .envelope:hover { transform: translateY(-3px); }

    .envelope .paper, .envelope .back, .envelope .front, .envelope .flap {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      transform-origin: top center;
    }

    .back {
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,219,231,0.82));
      box-shadow: 0 20px 50px rgba(0,0,0,0.16);
      border: 1px solid rgba(255,255,255,0.55);
      z-index: 0;
    }

    .front {
      background: linear-gradient(135deg, rgba(255,166,194,0.94), rgba(255,110,149,0.92));
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16);
      z-index: 2;
    }

    .flap {
      background: linear-gradient(135deg, rgba(255,211,227,0.96), rgba(255,120,154,0.86));
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      transform-origin: top center;
      z-index: 3;
      transition: transform 0.9s ease;
    }

    .paper {
      top: 44px;
      left: 30px;
      right: 30px;
      bottom: 32px;
      background: rgba(255,255,255,0.95);
      border-radius: 18px;
      box-shadow: inset 0 0 0 1px rgba(225,118,152,0.22), 0 10px 22px rgba(0,0,0,0.12);
      z-index: 1;
      transform: translateY(24px) scale(0.96);
      opacity: 0;
      transition: all 0.8s ease;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .envelope.open .flap { transform: rotateX(180deg); }
    .envelope.open .paper {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .envelope.open {
      opacity: 0;
      transform: scale(0.92) translateY(18px);
      pointer-events: none;
    }

    .letter-card {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px) scale(0.96);
      transition: all 0.7s ease;
      pointer-events: none;
      z-index: 1;
    }

    .letter-card.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .letter-card-inner {
      width: min(100%, 560px);
      min-height: 280px;
      border-radius: 26px;
      padding: 18px 22px;
      background: linear-gradient(135deg, rgba(255,235,243,0.98), rgba(255,210,225,0.94));
      box-shadow: 0 18px 40px rgba(180,60,80,0.16);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .letter-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .text-zone {
      width: 100%;
      background: transparent;
      font-size: 1.06rem;
      line-height: 1.85;
      color: #3d2430;
      font-weight: 400;
      white-space: pre-wrap;
      overflow-y: auto;
      padding: 8px 10px;
      min-height: 180px;
      max-height: 260px;
    }

    .text-zone .cursor {
      display: inline-block;
      width: 2px;
      height: 1.05em;
      background: #ff4f83;
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.9s step-end infinite;
    }

    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .side-stack {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 280px;
    }

    .gallery-zone {
      background: linear-gradient(135deg, rgba(255,241,244,0.95), rgba(255,221,233,0.8));
      border: 1px solid rgba(255,183,197,0.85);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 12px 26px rgba(180,60,80,0.12);
      animation: fadeUp 0.9s ease both;
      animation-delay: .4s;
    }

    .gallery-title {
      font-weight: 600;
      color: #a11b3e;
      margin-bottom: 10px;
      font-size: 0.95rem;
      text-align: center;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .gallery-item {
      border: none;
      padding: 0;
      border-radius: 16px;
      overflow: hidden;
      cursor: zoom-in;
      background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .gallery-item:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 10px 18px rgba(180,60,80,0.16); }
    .gallery-item img { display: block; width: 100%; height: 100px; object-fit: cover; }
    .gallery-caption { margin-top: 8px; text-align: center; color: #8c4358; font-size: 0.8rem; font-style: italic; }

    .tree-zone {
      display: none;
    }

    .countdown-section {
      margin-top: 16px;
      text-align: center;
      font-size: 1rem;
      font-weight: 300;
      background: rgba(255,220,225,0.34);
      padding: 12px 16px;
      border-radius: 60px;
      border: 1px solid rgba(255,176,176,0.8);
      color: #631e33;
      backdrop-filter: blur(6px);
      display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; letter-spacing: 0.5px;
    }

    .countdown-timer { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
    .countdown-timer span { background: rgba(255,255,255,0.85); padding: 0 12px; border-radius: 30px; font-weight: 600; color: #a11b3e; box-shadow: 0 2px 6px rgba(180,60,80,0.1); }

    .fire-btn {
      border: none;
      border-radius: 999px;
      padding: 7px 13px;
      background: linear-gradient(90deg, #ff5d90, #ff8f4a);
      color: white;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(250,90,136,0.24);
    }

    .music-player {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 20;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.12);
      color: white;
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,0.24);
    }

    .gallery-modal {
      position: fixed;
      inset: 0;
      background: rgba(8,3,12,0.75);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .gallery-modal.active { display: flex; }
    .gallery-modal .modal-box { position: relative; max-width: min(92vw, 820px); width: 100%; }
    .gallery-modal img { width: 100%; max-height: 80vh; object-fit: contain; border-radius: 24px; box-shadow: 0 24px 50px rgba(0,0,0,0.35); background: rgba(0,0,0,0.06); }
    /* Explosion / hearts animation for gallery end sequence */
    .gallery-grid { position: relative; }
    .exploding-heart { position: fixed; pointer-events: none; font-size: 18px; will-change: transform, opacity; transform-origin: center; }
    .gallery-item.explode {
      transition: transform 520ms cubic-bezier(.2,.9,.2,1), opacity 520ms ease;
      transform: scale(0.2) rotate(20deg) translateY(-30px);
      opacity: 0;
    }
    .final-overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,4,10,0.6); color: #ffd6e0; font-size: 2.2rem; font-weight: 800; z-index: 2200; opacity: 0; pointer-events: none; transition: opacity 420ms ease; }
    .final-overlay.show { opacity: 1; pointer-events: auto; }
    .final-overlay .line { display: flex; align-items: center; gap: 10px; }
    @keyframes heartFly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      70% { opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
    }
    .gallery-modal .modal-controls { display: flex; justify-content: center; gap: 12px; margin-top: 14px; }
    .gallery-modal button { border: none; padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #a11b3e; cursor: pointer; font-weight: 700; }
    .modal-close { position: absolute; top: -12px; right: -10px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 1.3rem; }

    @media (max-width: 900px) {
      .content { flex-direction: column; }
      .side-stack { min-width: unset; }
      .letter-column { order: 1; }
      .side-stack { order: 2; }
    }

    @media (max-width: 750px) {
      body { padding: 12px; }
      .card { padding: 18px; min-height: auto; }
      h1 { font-size: 2.2rem; }
      .photo-orbit { width: 160px; height: 160px; }
      .photo-frame { width: 128px; height: 128px; }
      .text-zone { font-size: .96rem; }
      .countdown-section { font-size: .9rem; padding: 10px 12px; }
    }

    @media (max-width: 480px) and (orientation: portrait) {
      /* Layout fixes for small portrait screens */
      body { padding: 10px 10px 20px; align-items: stretch; }
      .app-shell { width: 100%; }
      .card { border-radius: 18px; padding: 12px 12px 14px; }
      h1 { font-size: 1.95rem; margin: 6px 0 10px; }

      /* Hide heavy visuals that push the letter down */
      .photo-showcase { display: none !important; }
      #bgCanvas { display: none !important; }
      .floating-heart { display: none !important; }
      .music-player { display: none !important; }

      /* Ensure content stacks and letter is immediately visible */
      .content { flex-direction: column; gap: 8px; }
      .letter-column { width: 100%; order: 1; }
      .side-stack { order: 2; }

      /* Make envelope hidden and show the letter card directly */
      .envelope { display: none !important; }
      .letter-card {
        position: relative;
        inset: auto;
        opacity: 1;
        transform: none;
        pointer-events: auto;
        display: block;
        width: 100%;
        margin-bottom: 6px;
      }
      .letter-card-inner { width: 100%; min-height: auto; padding: 12px; border-radius: 14px; }

      /* Readable text area */
      .text-zone {
        font-size: 1.02rem;
        line-height: 1.68;
        padding: 6px 8px;
        min-height: 180px;
        max-height: none;
        overflow: auto;
      }

      /* Gallery adjustments */
      .gallery-grid { grid-template-columns: 1fr 1fr; }
      .gallery-item img { height: 84px; }
      .gallery-zone { padding: 10px; }

      /* Countdown and controls */
      .countdown-section { border-radius: 18px; flex-direction: column; padding: 10px 12px; gap: 8px; }
      .countdown-timer { font-size: 0.92rem; }

      /* Intro button full width */
      .intro-content { padding: 18px; }
      .intro-btn { width: 100%; padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="intro-screen" id="introScreen">
    <div class="intro-content">
      <p class="intro-line">Quelqu'un a préparé quelque chose de spécial pour toi...</p>
      <p class="intro-line secondary">Es-tu prête ?</p>
      <button class="intro-btn" id="openGift">❤️ Ouvrir mon cadeau ❤️</button>
    </div>
  </div>

  <div class="app-shell" id="appShell">
    <div class="card" id="mainCard">
      <h1>Pour Mon amour Francisca <span>❤️</span></h1>

      <div class="photo-showcase">
        <div class="photo-orbit">
          <div class="photo-halo"></div>
          <div class="photo-ring"></div>
          <div class="photo-frame">
            <img src="images/im2.jpeg" alt="Francisca">
          </div>
          <div class="orbit-heart" style="animation-delay: 0s">💖</div>
          <div class="orbit-heart" style="animation-delay: 1.4s">💗</div>
          <div class="orbit-heart" style="animation-delay: 2.8s">💕</div>
          <div class="orbit-heart" style="animation-delay: 4.2s">❤️</div>
        </div>
      </div>

      <div class="content">
        <div class="letter-column">
          <div class="envelope-shell">
            <div class="envelope" id="envelope">
              <div class="back"></div>
              <div class="flap"></div>
              <div class="paper">
                <div class="letter-content"></div>
              </div>
              <div class="front"></div>
            </div>

            <div class="letter-card" id="letterCard" aria-hidden="true">
              <div class="letter-card-inner">
                <div class="letter-content">
                  <div class="text-zone" id="typewriter"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="side-stack">
          <div class="gallery-zone">
            <div class="gallery-title">Pour toi</div>
            <div class="gallery-grid">
              <button class="gallery-item" type="button" data-full="images/im7.jpeg">
                <img src="images/im7.jpeg" alt="Moment romantique 1">
              </button>
              <button class="gallery-item" type="button" data-full="images/im4.jpeg">
                <img src="images/im4.jpeg" alt="Moment romantique 2">
              </button>
              <button class="gallery-item" type="button" data-full="images/im5.jpeg">
                <img src="images/im5.jpeg" alt="Moment romantique 3">
              </button>
              <button class="gallery-item" type="button" data-full="images/im8.jpeg">
                <img src="images/im8.jpeg" alt="Moment romantique 4">
              </button>
              <button class="gallery-item" type="button" data-full="images/im9.jpeg">
                <img src="images/im9.jpeg" alt="Moment romantique 5">
              </button>
              <button class="gallery-item" type="button" data-full="images/im11.jpeg">
                <img src="images/im11.jpeg" alt="Moment romantique 6">
              </button>
            </div>
            <div class="gallery-caption">Clique sur une photo pour la voir en grand.</div>
          </div>

        </div>
      </div>

      <div class="countdown-section">
        <span>💕 En attendant ton anniversaire...</span>
        <div class="countdown-timer" id="countdownDisplay">
          <span id="days">0</span>j
          <span id="hours">0</span>h
          <span id="minutes">0</span>min
          <span id="seconds">0</span>sec
        </div>
        <button class="fire-btn" id="fireButton" type="button">Joyeux anniversaire</button>
      </div>
    </div>
  </div>

  <button class="music-player" id="musicToggle" type="button" aria-label="Lecture musicale">🔊</button>

  <div class="gallery-modal" id="galleryModal" aria-hidden="true">
    <div class="modal-box">
      <button class="modal-close" type="button" aria-label="Fermer">×</button>
      <img id="modalImage" src="" alt="Vue pleine taille de la galerie">
      <div class="modal-controls">
        <button type="button" id="prevImage">← Précédent</button>
        <button type="button" id="nextImage">Suivant →</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      const appShell = document.getElementById('appShell');
      const introScreen = document.getElementById('introScreen');
      const openGiftBtn = document.getElementById('openGift');
      const card = document.getElementById('mainCard');
      const envelope = document.getElementById('envelope');
      const typewriterEl = document.getElementById('typewriter');
      const musicToggle = document.getElementById('musicToggle');
      const fireButton = document.getElementById('fireButton');
      const galleryModal = document.getElementById('galleryModal');
      const modalImage = document.getElementById('modalImage');
      const prevImageBtn = document.getElementById('prevImage');
      const nextImageBtn = document.getElementById('nextImage');
      const galleryItems = Array.from(document.querySelectorAll('.gallery-item'));

      function createFloatingHearts() {
        const body = document.body;
        const heartSymbols = ['❤️', '♥', '💕', '💗', '💖', '🌸'];
        for (let i = 0; i < 18; i++) {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
          const size = 16 + Math.floor(Math.random() * 32);
          heart.style.fontSize = size + 'px';
          heart.style.left = Math.random() * 100 + '%';
          heart.style.animationDuration = 12 + Math.random() * 18 + 's';
          heart.style.animationDelay = Math.random() * 20 + 's';
          heart.style.opacity = 0.2 + Math.random() * 0.35;
          body.appendChild(heart);
        }
      }
      createFloatingHearts();

      const textLines = [
        "À l'amour de ma vie, Francisca. ❤️",
        "En ce jour si spécial, je veux simplement te souhaiter un merveilleux anniversaire, mon amour.",
        "Que Dieu te bénisse abondamment, t'accorde une longue vie remplie de santé, de paix et de bonheur. Qu'Il exauce tous les désirs de ton cœur et t'ouvre les portes de la réussite dans tout ce que tu entreprendras.",
        "J'espère que cette journée sera aussi belle, lumineuse et remplie de joie que le sourire que tu apportes dans ma vie. Tu mérites tout le bonheur du monde, aujourd'hui et chaque jour à venir.",
        "Merci d'être la femme extraordinaire que tu es. Sache que je t'aime de tout mon cœur, aujourd'hui, demain et pour toujours.",
        "Joyeux anniversaire, mon amour. Je t'aime trop. ❤️"
      ];
      const fullText = textLines.join('\n');
      let charIndex = 0;
      let isTyping = false;
      let typingTimer = null;

      function typeNextChar() {
        if (!isTyping) return;
        if (charIndex < fullText.length) {
          const currentChar = fullText.charAt(charIndex);
          typewriterEl.innerHTML = fullText.substring(0, charIndex + 1) + '<span class="cursor"></span>';
          charIndex++;
          const delay = (currentChar === '\n' || currentChar === '.') ? 40 : 20;
          typingTimer = setTimeout(typeNextChar, delay);
        } else {
          typewriterEl.innerHTML = fullText + '<span class="cursor"></span>';
        }
      }

      function startTyping() {
        if (isTyping) return;
        isTyping = true;
        typewriterEl.innerHTML = '';
        charIndex = 0;
        typeNextChar();
      }

      function generateHeartLeaves() {
        const container = document.getElementById('leavesContainer');
        if (!container) return;
        container.innerHTML = '';
        const heartColors = ['#e91e63', '#f06292', '#ff6f91', '#ffb3b3', '#ff4d6d', '#c2185b', '#ff8a80'];
        const count = 42;
        const centerX = 90, centerY = 85;
        const radiusX = 70, radiusY = 60;
        for (let i = 0; i < count; i++) {
          const heart = document.createElement('span');
          heart.className = 'leaf-heart';
          heart.textContent = '❤️';
          heart.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
          const angle = (i / count) * 2 * Math.PI - Math.PI / 2;
          const heartFactor = 0.8 + 0.3 * Math.sin(angle * 2);
          const offsetX = centerX + radiusX * Math.cos(angle) * heartFactor * (0.9 + 0.15 * Math.sin(angle * 3));
          const offsetY = centerY + radiusY * Math.sin(angle) * heartFactor * (0.8 + 0.15 * Math.cos(angle * 2));
          const finalX = offsetX + (Math.random() - 0.5) * 14;
          const finalY = offsetY + (Math.random() - 0.5) * 14;
          heart.style.left = finalX + 'px';
          heart.style.top = finalY + 'px';
          const size = 22 + Math.floor(Math.random() * 18);
          heart.style.fontSize = size + 'px';
          const delay = 0.8 + (i / count) * 1.8 + Math.random() * 0.5;
          heart.style.animationDelay = delay + 's';
          heart.style.transform = `rotate(${Math.random() * 30 - 15}deg)`;
          container.appendChild(heart);
        }
      }
      setTimeout(generateHeartLeaves, 3600);

      const targetDate = new Date('2026-08-21T00:00:00').getTime();
      function updateCountdown() {
        const now = new Date().getTime();
        let diff = targetDate - now;
        if (diff < 0) diff = 0;
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);
        document.getElementById('days').textContent = String(days).padStart(2, '0');
        document.getElementById('hours').textContent = String(hours).padStart(2, '0');
        document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
        document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        if (diff === 0) {
          triggerFireworks();
          fireButton.textContent = '🎉 C’est le jour !';
        }
      }
      updateCountdown();
      setInterval(updateCountdown, 1000);

      let currentImageIndex = 0;
      function openGalleryModal(index) {
        currentImageIndex = index;
        modalImage.src = galleryItems[index].dataset.full;
        galleryModal.classList.add('active');
        galleryModal.setAttribute('aria-hidden', 'false');
        // If this is the last image, trigger the gallery explosion sequence shortly after opening
        if (index === galleryItems.length - 1) {
          setTimeout(() => {
            // if modal still open, close it before exploding gallery
            closeGalleryModal();
            triggerGalleryExplosion();
          }, 900);
        }
      }
      function closeGalleryModal() {
        galleryModal.classList.remove('active');
        galleryModal.setAttribute('aria-hidden', 'true');
      }
      function showNextImage(step) {
        currentImageIndex = (currentImageIndex + step + galleryItems.length) % galleryItems.length;
        modalImage.src = galleryItems[currentImageIndex].dataset.full;
      }

      // Explosion sequence: animate hearts across the screen from each gallery item,
      // remove items and show final message.
      function triggerGalleryExplosion() {
        const maxHeartsPerItem = 5;
        let completed = 0;
        const total = galleryItems.length;
        galleryItems.forEach((item, idx) => {
          const rect = item.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;

          // create a few hearts per item
          for (let h = 0; h < maxHeartsPerItem; h++) {
            const heart = document.createElement('span');
            heart.className = 'exploding-heart';
            heart.textContent = ['💖','💗','💕','❤️'][Math.floor(Math.random()*4)];
            const size = 12 + Math.floor(Math.random() * 20);
            heart.style.fontSize = size + 'px';
            heart.style.left = centerX - size/2 + 'px';
            heart.style.top = centerY - size/2 + 'px';
            // choose random destination offset
            const dx = (Math.random() - 0.5) * (window.innerWidth * 0.7);
            const dy = -200 - Math.random() * (window.innerHeight * 0.6);
            heart.style.setProperty('--dx', dx + 'px');
            heart.style.setProperty('--dy', dy + 'px');
            const dur = 700 + Math.floor(Math.random() * 700);
            heart.style.animation = `heartFly ${dur}ms cubic-bezier(.2,.9,.2,1) forwards`;
            document.body.appendChild(heart);
            // remove heart after animation
            setTimeout(() => heart.remove(), dur + 80);
          }

          // animate the gallery item itself
          setTimeout(() => {
            item.classList.add('explode');
            // remove item from layout after transition
            setTimeout(() => {
              item.style.visibility = 'hidden';
              completed++;
              if (completed === total) showFinalOverlay();
            }, 620);
          }, idx * 80);
        });
      }

      function showFinalOverlay() {
        // create overlay if not present
        let overlay = document.getElementById('finalOverlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'finalOverlay';
          overlay.className = 'final-overlay';
          overlay.innerHTML = `<div class="line">Love you MV <span style=\"font-size:1.2em; margin-left:6px;\">❤️</span></div>`;
          document.body.appendChild(overlay);
          // small pulse animation
          overlay.animate([{ transform: 'scale(0.96)' }, { transform: 'scale(1)' }], { duration: 700, iterations: 2, direction: 'alternate' });
        }
        overlay.classList.add('show');
        // after a while, gently hide floating hearts left in DOM
        setTimeout(() => {
          const hearts = document.querySelectorAll('.exploding-heart');
          hearts.forEach(h => h.remove());
        }, 4000);
      }
      galleryItems.forEach((item, index) => {
        item.addEventListener('click', () => openGalleryModal(index));
      });
      document.querySelector('.modal-close').addEventListener('click', closeGalleryModal);
      prevImageBtn.addEventListener('click', () => showNextImage(-1));
      nextImageBtn.addEventListener('click', () => showNextImage(1));
      galleryModal.addEventListener('click', (event) => {
        if (event.target === galleryModal) closeGalleryModal();
      });
      document.addEventListener('keydown', (event) => {
        if (!galleryModal.classList.contains('active')) return;
        if (event.key === 'ArrowRight') showNextImage(1);
        if (event.key === 'ArrowLeft') showNextImage(-1);
        if (event.key === 'Escape') closeGalleryModal();
      });

      openGiftBtn.addEventListener('click', () => {
        introScreen.classList.add('closing');
        appShell.classList.add('ready');
        setTimeout(() => {
          introScreen.style.display = 'none';
          envelope.classList.add('open');
          document.getElementById('letterCard').classList.add('visible');
          document.getElementById('letterCard').setAttribute('aria-hidden', 'false');
          setTimeout(startTyping, 850);
        }, 900);
        startMusic();
      });

      envelope.addEventListener('click', () => {
        envelope.classList.add('open');
        const card = document.getElementById('letterCard');
        card.classList.add('visible');
        card.setAttribute('aria-hidden', 'false');
        setTimeout(startTyping, 600);
      });

      let pointerX = window.innerWidth / 2;
      let pointerY = window.innerHeight / 2;
      const cursorHearts = [];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches || window.innerWidth < 900;
      document.addEventListener('pointermove', (event) => {
        pointerX = event.clientX;
        pointerY = event.clientY;
        if (!reducedMotion && cursorHearts.length < 3) {
          const h = document.createElement('div');
          h.className = 'floating-heart';
          h.style.left = pointerX + 'px';
          h.style.top = pointerY + 'px';
          h.textContent = ['💖', '💗', '💕'][Math.floor(Math.random() * 3)];
          h.style.fontSize = '18px';
          document.body.appendChild(h);
          cursorHearts.push(h);
        }
      });

      document.addEventListener('click', (event) => {
        explodeHearts(event.clientX, event.clientY);
        triggerFireworks(event.clientX, event.clientY);
      });

      function explodeHearts(x, y) {
        for (let i = 0; i < 10; i++) {
          const heart = document.createElement('div');
          heart.className = 'floating-heart';
          heart.textContent = ['💖', '❤️', '💕'][Math.floor(Math.random() * 3)];
          heart.style.left = x + 'px';
          heart.style.top = y + 'px';
          heart.style.fontSize = '20px';
          heart.style.animationDuration = '900ms';
          heart.style.opacity = '0.9';
          document.body.appendChild(heart);
          const angle = (i / 18) * Math.PI * 2;
          const distance = 60 + Math.random() * 80;
          const dx = Math.cos(angle) * distance;
          const dy = Math.sin(angle) * distance - 40;
          heart.animate([
            { transform: 'translate(0,0) scale(0.4)', opacity: 0.9 },
            { transform: `translate(${dx}px, ${dy}px) scale(1.2)`, opacity: 0 }
          ], { duration: 900, easing: 'cubic-bezier(.2,.9,.2,1)', fill: 'forwards' });
          setTimeout(() => heart.remove(), 900);
        }
      }

      card.addEventListener('mousemove', (event) => {
        const rect = card.getBoundingClientRect();
        const x = (event.clientX - rect.left) / rect.width;
        const y = (event.clientY - rect.top) / rect.height;
        const rotateY = (x - 0.5) * 10;
        const rotateX = (0.5 - y) * 8;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      });
      card.addEventListener('mouseleave', () => { card.style.transform = 'rotateX(0deg) rotateY(0deg)'; });

      const canvas = document.getElementById('bgCanvas');
      const ctx = canvas.getContext('2d');
      let width = 0, height = 0;
      const stars = [];
      const sparkles = [];
      const hearts = [];
      const petals = [];
      const bubbles = [];
      const fireworks = [];
      const confetti = [];

      function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
        const targetStars = reducedMotion ? 70 : 110;
        const targetSparkles = reducedMotion ? 30 : 55;
        const targetHearts = reducedMotion ? 8 : 16;
        const targetPetals = reducedMotion ? 6 : 12;
        const targetBubbles = reducedMotion ? 10 : 18;
        while (stars.length < targetStars) stars.push(createStar());
        while (sparkles.length < targetSparkles) sparkles.push(createSparkle());
        while (hearts.length < targetHearts) hearts.push(createHeartDrop());
        while (petals.length < targetPetals) petals.push(createPetal());
        while (bubbles.length < targetBubbles) bubbles.push(createBubble());
      }

      function createStar() {
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          r: Math.random() * 1.5 + 0.4,
          alpha: Math.random() * 0.8 + 0.2,
          speed: 0.01 + Math.random() * 0.01
        };
      }

      function createSparkle() {
        return {
          x: Math.random() * width,
          y: Math.random() * height,
          size: Math.random() * 2 + 0.8,
          alpha: Math.random() * 0.8 + 0.2,
          speed: 0.2 + Math.random() * 0.5
        };
      }

      function createHeartDrop() {
        return { x: Math.random() * width, y: -20 - Math.random() * height, size: 10 + Math.random() * 12, speed: 0.7 + Math.random() * 0.8, sway: Math.random() * 0.02 }; 
      }

      function createPetal() {
        return { x: Math.random() * width, y: -20 - Math.random() * height, size: 6 + Math.random() * 8, speed: 0.8 + Math.random() * 0.9, sway: Math.random() * 0.02 }; 
      }

      function createBubble() {
        return { x: Math.random() * width, y: Math.random() * height, r: 2 + Math.random() * 5, speed: 0.2 + Math.random() * 0.4, alpha: 0.08 + Math.random() * 0.2 }; 
      }

      function drawBackground(time) {
        ctx.clearRect(0, 0, width, height);
        const gradient = ctx.createLinearGradient(0, 0, width, height);
        gradient.addColorStop(0, '#06020d');
        gradient.addColorStop(0.5, '#1d0724');
        gradient.addColorStop(1, '#09040b');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        const glow = ctx.createRadialGradient(width * 0.2, height * 0.2, 40, width * 0.2, height * 0.2, width * 0.6);
        glow.addColorStop(0, 'rgba(255,103,155,0.18)');
        glow.addColorStop(1, 'rgba(255,103,155,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        for (const star of stars) {
          star.alpha = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(time * 0.001 * star.speed * 50 + star.x));
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${star.alpha})`;
          ctx.fill();
        }
        ctx.restore();

        for (const sparkle of sparkles) {
          sparkle.y += sparkle.speed;
          if (sparkle.y > height + 8) sparkle.y = -8;
          ctx.beginPath();
          ctx.arc(sparkle.x, sparkle.y, sparkle.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,223,238,${sparkle.alpha})`;
          ctx.fill();
        }

        for (const heart of hearts) {
          heart.y += heart.speed;
          heart.x += Math.sin(time * 0.001 * (heart.sway + 0.01)) * 0.4;
          if (heart.y > height + 20) { heart.y = -20; heart.x = Math.random() * width; }
          drawHeart(ctx, heart.x, heart.y, heart.size, 'rgba(255,120,155,0.75)');
        }

        for (const petal of petals) {
          petal.y += petal.speed;
          petal.x += Math.sin(time * 0.001 * 0.7 + petal.y * 0.01) * 0.5;
          if (petal.y > height + 20) { petal.y = -20; petal.x = Math.random() * width; }
          drawPetal(ctx, petal.x, petal.y, petal.size);
        }

        for (const bubble of bubbles) {
          bubble.y -= bubble.speed;
          if (bubble.y < -20) { bubble.y = height + 20; bubble.x = Math.random() * width; }
          ctx.beginPath();
          ctx.arc(bubble.x, bubble.y, bubble.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${bubble.alpha})`;
          ctx.fill();
        }

        for (let i = fireworks.length - 1; i >= 0; i--) {
          const fw = fireworks[i];
          fw.life -= 1;
          fw.x += fw.vx;
          fw.y += fw.vy;
          fw.vy += 0.02;
          ctx.beginPath();
          ctx.arc(fw.x, fw.y, fw.size, 0, Math.PI * 2);
          ctx.fillStyle = fw.color;
          ctx.fill();
          if (fw.life <= 0) fireworks.splice(i, 1);
        }

        for (let i = confetti.length - 1; i >= 0; i--) {
          const c = confetti[i];
          c.y += c.speed;
          c.x += c.drift;
          c.speed += 0.01;
          c.rotation += c.spin;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rotation);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size / 2);
          ctx.restore();
          if (c.y > height + 20) confetti.splice(i, 1);
        }

        for (const [index, heartItem] of cursorHearts.entries()) {
          heartItem.style.left = parseFloat(heartItem.style.left) + (pointerX - parseFloat(heartItem.style.left)) * 0.08 + 'px';
          heartItem.style.top = parseFloat(heartItem.style.top) + (pointerY - parseFloat(heartItem.style.top)) * 0.08 + 'px';
          heartItem.style.opacity = Math.max(0, Number(heartItem.style.opacity) - 0.01).toFixed(2);
          if (Number(heartItem.style.opacity) <= 0) { heartItem.remove(); cursorHearts.splice(index, 1); }
        }

        requestAnimationFrame(drawBackground);
      }

      function drawHeart(ctx, x, y, size, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(size / 16, size / 16);
        ctx.beginPath();
        ctx.moveTo(0, 8);
        ctx.bezierCurveTo(0, 4, -4, 0, -8, 0);
        ctx.bezierCurveTo(-12, 0, -12, 6, -8, 9);
        ctx.bezierCurveTo(-6, 12, 0, 15, 0, 18);
        ctx.bezierCurveTo(0, 15, 6, 12, 8, 9);
        ctx.bezierCurveTo(12, 6, 12, 0, 8, 0);
        ctx.bezierCurveTo(4, 0, 0, 4, 0, 8);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
      }

      function drawPetal(ctx, x, y, size) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(Math.PI / 5);
        ctx.fillStyle = 'rgba(255,183,197,0.85)';
        ctx.beginPath();
        ctx.ellipse(0, 0, size, size * 0.7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function triggerFireworks(x = window.innerWidth / 2, y = window.innerHeight / 3) {
        for (let i = 0; i < 34; i++) {
          const angle = (Math.PI * 2 * i) / 34;
          const speed = 2 + Math.random() * 3;
          fireworks.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.5,
            life: 48 + Math.floor(Math.random() * 25), size: 2 + Math.random() * 2,
            color: `hsl(${Math.random() * 360}, 90%, 65%)`
          });
        }
        for (let i = 0; i < 90; i++) {
          confetti.push({
            x, y, speed: 1 + Math.random() * 2, drift: (Math.random() - 0.5) * 0.7, rotation: Math.random() * Math.PI, spin: 0.01 + Math.random() * 0.02, size: 5 + Math.random() * 4, color: `hsl(${Math.random() * 360}, 90%, 70%)`
          });
        }
        navigator.vibrate?.(120);
      }

      fireButton.addEventListener('click', () => triggerFireworks());

      let audioCtx;
      let masterGain;
      let isMusicOn = false;
      let musicInterval;
      const melody = [329.63, 392.0, 440.0, 392.0, 349.23, 329.63, 293.66, 261.63];

      function startMusic() {
        if (isMusicOn) return;
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          masterGain = audioCtx.createGain();
          masterGain.gain.value = 0.0001;
          masterGain.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        isMusicOn = true;
        musicToggle.textContent = '🔈';
        const now = audioCtx.currentTime;
        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setTargetAtTime(0.035, now, 0.18);
        let idx = 0;
        const playNext = () => {
          if (!isMusicOn) return;
          const freq = melody[idx % melody.length];
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gainNode.gain.setValueAtTime(0.0001, audioCtx.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(0.03, audioCtx.currentTime + 0.05);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.7);
          osc.connect(gainNode).connect(masterGain);
          osc.start(audioCtx.currentTime);
          osc.stop(audioCtx.currentTime + 0.75);
          idx++;
          musicInterval = setTimeout(playNext, 720);
        };
        playNext();
      }

      function stopMusic() {
        isMusicOn = false;
        clearTimeout(musicInterval);
        if (audioCtx) {
          const now = audioCtx.currentTime;
          masterGain.gain.cancelScheduledValues(now);
          masterGain.gain.setTargetAtTime(0.0001, now, 0.15);
        }
        musicToggle.textContent = '🔊';
      }

      musicToggle.addEventListener('click', () => {
        if (isMusicOn) stopMusic(); else startMusic();
      });

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      requestAnimationFrame(drawBackground);
    })();
  </script>
</body>
</html>
